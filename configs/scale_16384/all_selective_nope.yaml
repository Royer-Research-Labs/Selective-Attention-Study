# 209M x 16K, Selective Attention in every layer, NO position signal (all_selective_nope).
# Identical to Dilution-Attention's configs/scale_16384/all_softmax_nope_lr6e-4.yaml and
# all_dilution_nope.yaml except `model.attention` and the output directory: 24L d768 12H, ctx 16384,
# 2 x 2 (grad accum) x 16384 = 65,536 tok/step, LR 6e-4, the 128,174-step cosine run to its
# step-64,000 checkpoint (4.19B tokens, 1x Chinchilla) with --stop-at-step 64000.
model:
  vocab_size: 50304
  n_layers: 24
  d_model: 768
  n_heads: 12
  context_length: 16384
  positional: none
  rope_theta: 500000
  bias: false
  mlp: swiglu
  attention: selective
data:
  synthetic: false
  vocab_size: 50304
  train_path: data/fineweb_edu_100bt_40b/train.bin
  val_path: data/fineweb_edu_100bt_40b/val.bin
  train_tokens: 40000000000
  val_tokens: 20000000
  seed: 1337
training:
  device: auto
  dtype: auto
  compile: true
  batch_size: 2
  sequence_length: 16384
  gradient_accumulation_steps: 2
  max_steps: 128174
  learning_rate: 6e-4
  min_lr_ratio: 0.1
  warmup_steps: 1000
  weight_decay: 0.1
  grad_clip: 1.0
  fused_optimizer: true
  log_interval: 25
  eval_interval: 1000
  eval_batches: 8
  checkpoint_interval: 1000
  seed: 1337
  output_dir: runs/scale_16384/all_selective_nope
